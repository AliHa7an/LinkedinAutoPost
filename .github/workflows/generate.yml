name: Generate content

# Claude Code (via CLAUDE_CODE_OAUTH_TOKEN, Ali's Claude subscription) writes the day's post + image.
# Runs daily at ~08:20 PKT, with a backup run at ~10:50 PKT that does nothing if the post already exists.
# "Daily LinkedIn post" publishes it at 3:00 PM PKT. If this run finishes after 3 PM, it publishes itself.
# Can also be started from the Actions tab, or by pushing requests/run.json.

on:
  schedule:
    # Hourly tries 8:20 AM ... 8:20 PM PKT, because GitHub can start scheduled runs hours late.
    # A run finishes in seconds without using Claude when today's post already exists or is published.
    - cron: '20 3-15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (empty = today, Asia/Karachi)'
        required: false
        default: ''
      note:
        description: 'Extra instructions for this run (optional)'
        required: false
        default: ''
      publish_at:
        description: 'Publish at this exact PKT time HH:MM (optional; for tests/extra posts, e.g. 18:40)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: linkedin-repo
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # ref: main = the latest commit when this job starts (after any queued run finished),
      # not the commit that triggered it. Prevents a queued run from acting on stale history.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Work out date and state
        id: when
        env:
          IN_DATE: ${{ inputs.date }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          DATE="$IN_DATE"; NOTE="$IN_NOTE"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Karachi date +%F)
          if ! echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]+)?$'; then echo "Bad date: $DATE"; exit 1; fi
          NOW=$(TZ=Asia/Karachi date '+%Y-%m-%d %H:%M')
          POSTED=$(python -c "import json,sys;print('true' if any(h.get('slot',h['date'])=='$DATE' for h in json.load(open('data/history.json'))) else 'false')")
          CARRIED=false
          # Yesterday's post was prepared but never published (e.g. GitHub ran too late)? Reuse it today
          # instead of spending tokens, unless it is time-sensitive (verified-today status or a job post).
          if [ "$POSTED" = "false" ] && [ ! -f "posts/$DATE/post.json" ] && [ "${#DATE}" = "10" ]; then
            Y=$(date -d "$DATE -1 day" +%F)
            if [ -f "posts/$Y/post.json" ] && ! grep -q "\"$Y\"" data/history.json && \
               python -c "import json,sys;p=json.load(open('posts/$Y/post.json'));sys.exit(0 if not p.get('status_verified_today') and p.get('category')!='jobs' else 1)"; then
              git mv "posts/$Y" "posts/$DATE"
              python -c "import json;f='posts/$DATE/post.json';p=json.load(open(f));p['date']='$DATE';json.dump(p,open(f,'w'),indent=2,ensure_ascii=False)"
              if (cd scripts && python validate.py "$DATE" >/dev/null); then CARRIED=true; echo "Carried over unpublished post from $Y"
              else git mv "posts/$DATE" "posts/$Y"; git checkout -- "posts/$Y"; fi
            fi
          fi
          HAVE=false
          if [ -f "posts/$DATE/post.json" ] && (cd scripts && python validate.py "$DATE" >/dev/null); then HAVE=true; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          echo "posted=$POSTED" >> "$GITHUB_OUTPUT"
          echo "have_post=$HAVE" >> "$GITHUB_OUTPUT"
          echo "carried=$CARRIED" >> "$GITHUB_OUTPUT"
          { echo 'note<<EOF_NOTE'; echo "$NOTE" | head -c 2000; echo; echo 'EOF_NOTE'; } >> "$GITHUB_OUTPUT"
          echo "Target $DATE (now $NOW PKT) | already posted: $POSTED | valid post ready: $HAVE"

      - name: Install dependencies (skipped when the day is already done)
        if: steps.when.outputs.posted == 'false'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/work

      - name: Prepare Claude token
        if: steps.when.outputs.posted == 'false' && steps.when.outputs.have_post == 'false'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Remove spaces/line breaks that sneak in when copying the token from a terminal.
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ -z "$CLEAN" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing"; exit 1; fi
          echo "::add-mask::$CLEAN"
          echo "CLAUDE_TOKEN_CLEAN=$CLEAN" >> "$GITHUB_ENV"

      - name: Claude writes the post
        id: claude
        if: steps.when.outputs.posted == 'false' && steps.when.outputs.have_post == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          prompt: |
            Read .github/prompts/daily.md and follow it exactly.

            Target date: ${{ steps.when.outputs.date }}
            Current time: ${{ steps.when.outputs.now }} (Asia/Karachi)
            Extra note for this run: ${{ steps.when.outputs.note }}
          claude_args: |
            --max-turns 60
            --model ${{ vars.CLAUDE_MODEL || 'sonnet' }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,TodoWrite"

      - name: Report Claude usage
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python - <<'EOF'
          import json, os
          try:
              d = json.load(open(os.environ["EXEC_FILE"]))
          except Exception as e:
              print("no execution file:", e); raise SystemExit(0)
          arr = d if isinstance(d, list) else [d]
          r = next((m for m in reversed(arr) if isinstance(m, dict) and m.get("type") == "result"), {})
          u = r.get("usage") or {}
          sysm = next((m for m in arr if isinstance(m, dict) and m.get("type") == "system"), {})
          inp, out = u.get("input_tokens", 0), u.get("output_tokens", 0)
          cr, cw = u.get("cache_read_input_tokens", 0), u.get("cache_creation_input_tokens", 0)
          line = (f"model={sysm.get('model')} | turns={r.get('num_turns')} | input={inp:,} | cache_write={cw:,} | cache_read={cr:,} | "
                  f"output={out:,} | total={inp+cw+cr+out:,} | api_equivalent=${r.get('total_cost_usd', 0):.2f} | "
                  f"minutes={round((r.get('duration_ms') or 0)/60000, 1)}")
          print(f"::notice title=Claude usage::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n**Claude usage:** {line}\n")
          EOF

      - name: Show Claude error (if any)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python - <<'EOF'
          import json, os
          try:
              d = json.load(open(os.environ["EXEC_FILE"]))
          except Exception as e:
              print("no execution file:", e); raise SystemExit(0)
          arr = d if isinstance(d, list) else [d]
          res = next((m for m in reversed(arr) if isinstance(m, dict) and m.get("type") == "result"), arr[-1])
          txt = " ".join(str(res.get("result") or res.get("error") or res).split())[:1500]
          print(f"::error title=Claude result::{txt}")
          EOF

      - name: Validate and render
        if: steps.when.outputs.posted == 'false'
        run: |
          cd scripts
          python validate.py "${{ steps.when.outputs.date }}"
          python render.py "${{ steps.when.outputs.date }}" --preview /tmp/review

      - name: Keep a copy for review (7 days)
        if: always()
        run: |
          mkdir -p /tmp/review
          cp -r "posts/${{ steps.when.outputs.date }}" /tmp/review/ 2>/dev/null || true
          [ -f /tmp/run-summary.md ] && cp /tmp/run-summary.md /tmp/review/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ steps.when.outputs.date }}
          path: /tmp/review
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the post
        if: steps.when.outputs.posted == 'false' && (steps.when.outputs.have_post == 'false' || steps.when.outputs.carried == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.when.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A posts/
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          TOPIC=$(python -c "import json;print(json.load(open('posts/$DATE/post.json'))['topic'][:80])")
          git commit -m "Post for $DATE: $TOPIC${{ steps.when.outputs.carried == 'true' && ' (carried over)' || '' }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1

      - name: Publish (at publish_at, or now if 3 PM PKT has passed)
        id: publish
        if: steps.when.outputs.posted == 'false'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.when.outputs.date }}
          AT: ${{ inputs.publish_at }}
        run: |
          TODAY=$(TZ=Asia/Karachi date +%F); HM=$(TZ=Asia/Karachi date +%H%M)
          if [ -n "$AT" ]; then
            git pull -q --rebase origin main || true
            (cd scripts && python post.py --date "$DATE" --at "$AT")
          elif [ "${DATE:0:10}" != "$TODAY" ] || [ "$HM" -lt 1500 ]; then
            echo "Before 3 PM PKT (or not today): the 'Daily LinkedIn post' workflow will publish it."
            echo "status=queued" >> "$GITHUB_OUTPUT"; exit 0
          else
            git pull -q --rebase origin main || true
            (cd scripts && python post.py --date "$DATE")
          fi
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Posted $DATE [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              sleep $((i * 5))
            done
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f /tmp/run-summary.md ]; then cat /tmp/run-summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "No summary written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="LinkedIn content generation failed for ${{ steps.when.outputs.date }}"
          if [ "$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq length)" != "0" ]; then exit 0; fi
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Nothing was published by this run. Open the run for the error (the Claude step shows its result). Re-run it from the Actions tab, or push requests/run.json."
