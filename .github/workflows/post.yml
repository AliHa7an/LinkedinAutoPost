name: Daily LinkedIn post (3 PM PKT)

on:
  schedule:
    # GitHub's scheduler can start runs hours late, so this tries many times. Every run first
    # checks data/history.json and does nothing if today's post is already published, so there is
    # never more than one post per day. Runs before 2:15 PM PKT exit without posting.
    - cron: "40 9 * * *"    # 2:40 PM PKT -> waits, posts at 3:00 PM
    - cron: "5 10-18 * * *" # hourly retries 3:05 PM ... 11:05 PM PKT
  workflow_dispatch:
    inputs:
      date:
        description: "Post date YYYY-MM-DD (blank = today in PKT)"
        required: false
      dry_run:
        description: "Dry run (validate + render only, do NOT publish)"
        type: boolean
        default: true

concurrency:
  group: linkedin-repo
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ref: main = latest history when the job starts, so a queued backup run never posts twice.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Already posted today?
        id: pre
        run: |
          DAY="${{ inputs.date }}"; [ -z "$DAY" ] && DAY=$(TZ=Asia/Karachi date +%F)
          if python3 -c "import json,sys;sys.exit(0 if any(h.get('slot',h['date'])=='$DAY' for h in json.load(open('data/history.json'))) else 1)"; then
            echo "Already posted for $DAY: nothing to do."; echo "done=true" >> "$GITHUB_OUTPUT"
          else echo "done=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        if: steps.pre.outputs.done != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Publish
        id: publish
        if: steps.pre.outputs.done != 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          WAIT_FOR_POST_TIME: ${{ github.event_name == 'schedule' && '1' || '0' }}
          RECORD_WITH_GIT: '1'
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          cd scripts && python post.py $ARGS

      - name: Save rendered image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-image
          path: |
            posts/*/image.png
            posts/*/image.gif
          if-no-files-found: ignore

      - name: Alert if something needs attention
        if: failure() || steps.publish.outputs.status == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.publish.outputs.status }}
        run: |
          # "missing" only matters after the last backup run; earlier the generator may still be working.
          if [ "$STATUS" = "missing" ] && [ "$(TZ=Asia/Karachi date +%H)" -lt 22 ]; then
            echo "No post yet; a later run may still publish it. Not alerting before 10 PM PKT."; exit 0
          fi
          case "$STATUS" in
            token_expired|no_token) TITLE="LinkedIn token expired or missing: renew it";;
            invalid) TITLE="Today's LinkedIn post failed safety checks (not published)";;
            missing) TITLE="No LinkedIn post was prepared for today";;
            *) TITLE="LinkedIn auto-post failed";;
          esac
          if [ "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq length)" != "0" ]; then
            echo "Issue already open"; exit 0
          fi
          gh issue create --title "$TITLE" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Nothing was posted. Open the run log for details. See README > Troubleshooting."
