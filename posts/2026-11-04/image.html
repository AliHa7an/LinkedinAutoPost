  <div><h1>Stop calling a service that’s <em>already down</em></h1><p class="sub">The circuit breaker: three states, one job.</p></div>
  <main>
    <svg viewBox="0 0 936 560" width="936" height="560">
      <rect class="node ok" x="40" y="30" width="300" height="110" rx="12"/><text class="nlabel" x="190" y="80" text-anchor="middle">Closed</text><text class="nsub" x="190" y="115" text-anchor="middle">calls pass through</text>
      <rect class="node hl" x="596" y="30" width="300" height="110" rx="12"/><text class="nlabel" x="746" y="80" text-anchor="middle">Open</text><text class="nsub" x="746" y="115" text-anchor="middle">calls fail instantly</text>
      <rect class="node" x="318" y="300" width="300" height="110" rx="12"/><text class="nlabel" x="468" y="350" text-anchor="middle">Half-open</text><text class="nsub" x="468" y="385" text-anchor="middle">a few trial calls</text>
      <path class="edge" d="M340 85 H596"/><path class="edge" d="M584 73 l14 12 l-14 12"/>
      <path class="edge" d="M746 140 V355 H618"/><path class="edge" d="M630 343 l-14 12 l14 12"/>
      <path class="edge" d="M318 355 H190 V140"/><path class="edge" d="M178 152 l12 -14 l12 14"/>
      <text class="nsmall" x="40" y="470">1  Failures hit the threshold: open.</text>
      <text class="nsmall" x="40" y="508">2  Timeout ends: half-open.</text>
      <text class="nsmall" x="40" y="546">3  Trials pass: closed. Trial fails: open.</text>
    </svg>
  </main>
