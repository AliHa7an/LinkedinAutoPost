<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#f4e9d4;font-family:'Fredoka',sans-serif;color:#2b2a33;padding:70px 64px 50px;display:flex;flex-direction:column;gap:40px}
h1{font-size:68px;line-height:1.1;color:#2b2a33}
.sub{font-size:32px;color:#6b5f4b;margin-top:14px}
.card{border-radius:24px;padding:36px 40px;display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center;box-shadow:10px 12px 0 #2b2a33}
.bad{background:#ff8a7a;transform:rotate(-1deg)}
.good{background:#8fd9a8;transform:rotate(1deg)}
.tag{font-size:36px;font-weight:700}
code{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;line-height:1.4;background:#fff8e8;border-radius:14px;padding:18px 22px;display:block}
.note{font-size:34px;line-height:1.3;font-weight:500}
footer{display:flex;justify-content:space-between;font-size:32px;font-weight:700}
</style></head><body>
<div><h1>NoInfer&lt;C&gt;</h1><div class="sub">TypeScript 5.4 · one list defines the valid set</div></div>
<div class="card bad"><div class="tag">✗ WITHOUT</div><code>defaultColor?: C</code><div class="note">"blue" widens C. No error.</div></div>
<div class="card good"><div class="tag">✓ WITH NoInfer</div><code>defaultColor?: NoInfer&lt;C&gt;</code><div class="note">Only colors[] infers C. "blue" fails.</div></div>
<footer><span>Ali Hassan</span><span>alihexan.com</span></footer>
</body></html>
