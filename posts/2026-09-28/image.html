<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b2545; --grid:rgba(141,190,255,.12); --line:#8dbeff; --ink:#eaf2ff; --muted:#9fb7d9; --ok:#5ee3a1; --warn:#ffb454; }
  * { margin:0; box-sizing:border-box; }
  html,body { width:800px; height:1000px; overflow:hidden; }
  body {
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      radial-gradient(120% 80% at 50% 0%, #13386b 0%, var(--bg) 60%);
    color:var(--ink); font-family:'Space Grotesk',sans-serif; position:relative;
  }
  .frame { position:absolute; inset:22px; border:2px solid rgba(141,190,255,.35); }
  .tag { position:absolute; top:52px; left:60px; font:700 18px 'JetBrains Mono',monospace; color:var(--line); letter-spacing:.14em; }
  h1 { position:absolute; top:84px; left:60px; right:60px; font-size:54px; line-height:1.05; font-weight:700; }
  h1 span { color:var(--warn); }
  .sub { position:absolute; top:212px; left:60px; font-size:26px; color:var(--muted); }
  svg { position:absolute; top:270px; left:0; }
  .box { fill:rgba(11,37,69,.9); stroke:var(--line); stroke-width:2.5; }
  .lbl { fill:var(--ink); font:700 24px 'JetBrains Mono',monospace; }
  .small { fill:var(--muted); font:500 19px 'JetBrains Mono',monospace; }
  .wire { stroke:var(--line); stroke-width:2.5; fill:none; stroke-dasharray:8 7; }
  .footer { position:absolute; bottom:48px; left:60px; right:60px; display:flex; justify-content:space-between;
            font:700 22px 'JetBrains Mono',monospace; color:var(--ink); border-top:2px solid rgba(141,190,255,.35); padding-top:18px; }
  .footer b { color:var(--line); }
</style>
</head>
<body>
<div class="frame"></div>
<div class="tag">SYSTEM DESIGN · WEBHOOKS</div>
<h1>Webhooks arrive <span>twice.</span><br>Plan for it.</h1>
<div class="sub">One idempotent handler, zero duplicate orders.</div>

<svg width="800" height="620" viewBox="0 0 800 620">
  <!-- wires -->
  <path id="p-main" class="wire" d="M400 70 V150 M400 210 V270"/>
  <path class="wire" d="M400 330 H200 V420"/>
  <path class="wire" d="M400 330 H600 V420 M600 480 V520"/>

  <!-- first delivery: goes all the way to the worker -->
  <circle r="11" fill="#8dbeff">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.45;1" keyPoints="0;1;1"
      path="M400 45 V300 H600 V550"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.45;0.5;1" values="1;1;0;0"/>
  </circle>
  <!-- retry of the same event: stopped at the check -->
  <circle r="11" fill="#ffb454">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.45;0.85;1" keyPoints="0;0;1;1"
      path="M400 45 V300 H200 V450"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.44;0.45;0.85;0.92;1" values="0;0;1;1;0;0"/>
  </circle>
  <text class="small" x="430" y="120" fill="#ffb454" style="fill:#ffb454">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.45;0.5;0.85;0.9;1" values="0;0;1;1;0;0"/>retry: same event_id</text>
  <!-- boxes -->
  <rect class="box" x="250" y="20" width="300" height="50" rx="10"/>
  <text class="lbl" x="400" y="53" text-anchor="middle">Provider</text>

  <rect class="box" x="250" y="150" width="300" height="60" rx="10"/>
  <text class="lbl" x="400" y="188" text-anchor="middle">POST /webhooks</text>

  <rect class="box" x="220" y="270" width="360" height="60" rx="10" style="stroke:#ffb454"/>
  <text class="lbl" x="400" y="308" text-anchor="middle">event_id seen?</text>

  <text class="small" x="186" y="385" text-anchor="end">yes</text>
  <text class="small" x="614" y="385">no</text>

  <rect class="box" x="60" y="420" width="280" height="60" rx="10" style="stroke:#5ee3a1"/>
  <text class="lbl" x="200" y="458" text-anchor="middle">200 OK · stop</text>

  <rect class="box" x="460" y="420" width="280" height="60" rx="10"/>
  <text class="lbl" x="600" y="458" text-anchor="middle">save + enqueue</text>

  <rect class="box" x="460" y="520" width="280" height="60" rx="10"/>
  <text class="lbl" x="600" y="558" text-anchor="middle">worker (safe ×2)</text>

</svg>

<div class="footer"><span>Ali Hassan</span><b>alihexan.com</b></div>
</body>
</html>
