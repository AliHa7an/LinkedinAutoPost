<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#f3e6c8;font-family:'Space Mono',monospace;color:#2b2118;display:flex;flex-direction:column;padding:56px;gap:32px;border:14px solid #d9542b}
h1{font-family:'Bebas Neue';font-size:128px;line-height:.95;color:#d9542b;letter-spacing:2px}
h2{font-family:'Bebas Neue';font-size:46px;color:#1f6f78;letter-spacing:2px}
.sub{font-size:30px;font-weight:700}
.card{padding:32px;border:5px solid #2b2118;font-size:32px;line-height:1.45;display:flex;flex-direction:column;gap:14px}
.bad{background:#f7c9b8}
.good{background:#bfe0d6}
.tag{color:#d9542b;font-weight:700}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:30px;font-weight:700;border-top:5px solid #2b2118;padding-top:22px}
</style></head><body>
<h1>TAG YOUR<br>PROMPT</h1>
<div class="sub">One block per kind of content.</div>
<div class="card bad"><h2>BEFORE</h2><div>Summarize this ticket politely and keep it short. Ticket: {{ticket}}</div></div>
<div class="card good"><h2>AFTER</h2>
<div><span class="tag">&lt;instructions&gt;</span> 2 sentences, polite <span class="tag">&lt;/instructions&gt;</span></div>
<div><span class="tag">&lt;ticket&gt;</span> {{ticket}} <span class="tag">&lt;/ticket&gt;</span></div></div>
<div class="foot"><span>Ali Hassan</span><span>alihexan.com</span></div>
</body></html>
